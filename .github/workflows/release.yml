name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Non-recursive: extern/libKCD1's own nested submodules (Projects/*)
          # are dev-only upstream project trees this plugin doesn't build
          # against, and are unreachable over SSH from an unauthenticated
          # checkout.
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64 build-essential

      - name: Build
        run: ./build.sh

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-mingw/CombatAssist.dll
          generate_release_notes: true
